[project]
name = "project-management-service"
version = "0.1.0"
description = "Project management/profiles dashboard service"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "sqlalchemy>=2.0.29,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.1,<2.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9,<0.1.0",
    "boto3>=1.34.74,<2.0.0",
    "email-validator>=2.1.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9.0.0",
    "pytest-asyncio>=0.23.6,<0.24.0",
    "httpx>=0.27.0,<0.28.0",
    "ruff>=0.3.5,<0.4.0",
    "black>=24.3.0,<25.0.0",
    "mypy>=1.9.0,<2.0.0",
    "moto>=5.0.5,<6.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"app/models/*.py" = ["F821"]
"app/schemas/project.py" = ["E402"]
"migrations/env.py" = ["F401", "F403"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "migrations/versions/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
