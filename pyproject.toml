[tool.poetry]
name = "project-management-service"
version = "0.1.0"
description = "Project management/profiles dashboard service"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
sqlalchemy = "^2.0.29"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "4.0.1"  # pinned: passlib's backend detection breaks on bcrypt>=4.1
python-multipart = "^0.0.9"
boto3 = "^1.34.74"
email-validator = "^2.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
httpx = "^0.27.0"
ruff = "^0.3.5"
black = "^24.3.0"
mypy = "^1.9.0"
moto = "^5.0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query", "fastapi.Body"]


[tool.ruff.lint.per-file-ignores] 
"app/models/*.py" = ["F821"] # SQLAlchemy string forward-refs to sibling-module classes 
"app/schemas/project.py" = ["E402"] # deliberate late import to avoid a circular import 
"migrations/env.py" = ["F401", "F403"] # wildcard import needed to register all models on Base.metadata

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "migrations/versions/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
